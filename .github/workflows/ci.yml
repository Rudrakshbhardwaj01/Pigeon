# Continuous integration for Pigeon.
#
# Two jobs, kept deliberately lean:
#   1. rust    — formatting, linting, the full engine test suite (unit +
#                native optical roundtrips), and a wasm-pack compile check so
#                the WASM boundary cannot silently break.
#   2. web     — TypeScript type check, ESLint, unit/component tests, the
#                production build, and the real-browser E2E suite (including
#                the offline roundtrip) via Playwright.
#
# Toolchains are pinned by rust-toolchain.toml (Rust) and the Node version in
# `engines` (npm). Dependency audits run on every push as a non-blocking
# advisory check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (unit + native optical roundtrips)
        run: cargo test --workspace

      - name: WASM compile check (wasm-pack)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
          wasm-pack build crates/pigeon-wasm --target web --release --out-dir ../../apps/web/src/wasm/pigeon-wasm

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit and component tests (vitest)
        run: npm run test:web

      - name: Production build
        run: npm run build
        # The committed WASM engine at apps/web/src/wasm/pigeon-wasm/ means no
        # Rust toolchain is needed here; CI's rust job independently verifies
        # that the committed engine still matches the Rust sources.

      - name: Install Playwright browser
        run: npx --workspace @pigeon/web playwright install --with-deps chromium

      - name: Browser E2E (includes the offline roundtrip)
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory only: known-vulnerability reports should not block unrelated
    # work, but they must be visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm dependency audit
        run: npm audit --omit=dev || true
      - name: Rust dependency advisories (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit || true
