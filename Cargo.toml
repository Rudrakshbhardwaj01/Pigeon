[workspace]
resolver = "2"
members = ["crates/pigeon-core", "crates/pigeon-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
crc32c = "0.6"
sha2 = "0.10"
flate2 = "1"
raptorq = "2"
fast_qr = "0.14"
gif = "0.14"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
